# Prometheus alerting rules for nbu_exporter.
#
# Load via prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/nbu.rules.yml
#
# Validate:  promtool check rules deploy/prometheus/nbu.rules.yml
groups:
  - name: nbu_exporter
    rules:
      # ----------------------------------------------------------- Availability
      - alert: NbuExporterDown
        expr: up{job="netbackup"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "nbu_exporter is not scrapable ({{ $labels.instance }})"
          description: "Prometheus cannot scrape the NetBackup exporter for >5m."

      - alert: NbuApiUnreachable
        expr: nbu_up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "NetBackup API unreachable on site {{ $labels.site }}"
          description: "All NetBackup collections (storage and jobs) for site {{ $labels.site }} have failed for >10m."

      # ------------------------------------------------------------- Staleness
      - alert: NbuMetricsStale
        expr: time() - nbu_last_scrape_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NetBackup {{ $labels.source }} metrics are stale"
          description: "No successful {{ $labels.source }} collection in >30m on site {{ $labels.site }}."

      # ----------------------------------------------------------- Backup SLOs
      # Per site, so one healthy master cannot mask a failing one. The `or 0 * ...`
      # keeps the series when *every* backup failed (no status="0" series at all) —
      # without it the expression is empty and the alert can never fire.
      - alert: NbuBackupSuccessRateLow
        expr: |
          (
            sum by (site) (nbu_status_count{action="BACKUP",status="0"})
              or 0 * sum by (site) (nbu_status_count{action="BACKUP"})
          )
            / clamp_min(sum by (site) (nbu_status_count{action="BACKUP"}), 1) * 100 < 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backup success rate below 90% on site {{ $labels.site }}"
          description: "BACKUP success rate on site {{ $labels.site }} is {{ printf \"%.1f\" $value }}% over the current window."

      - alert: NbuJobsQueuedSustained
        expr: sum by (site) (nbu_jobs_queued_count) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "NetBackup jobs queued for >30m on site {{ $labels.site }}"
          description: "{{ $value }} job(s) remain queued on site {{ $labels.site }}; check media/storage availability (nbu_jobs_queued_count by reason)."

      # --------------------------------------------------------------- Storage
      - alert: NbuStorageAlmostFull
        expr: |
          sum by (site, name) (nbu_disk_bytes{size="used"})
            / sum by (site, name) (nbu_disk_bytes) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Storage unit {{ $labels.name }} over 90% used on site {{ $labels.site }}"
          description: "{{ $labels.name }} is {{ printf \"%.1f\" $value }}% full."

      - alert: NbuStorageWarning
        expr: |
          sum by (site, name) (nbu_disk_bytes{size="used"})
            / sum by (site, name) (nbu_disk_bytes) * 100 > 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Storage unit {{ $labels.name }} over 80% used on site {{ $labels.site }}"
          description: "{{ $labels.name }} is {{ printf \"%.1f\" $value }}% full."
