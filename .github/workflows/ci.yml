name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    uses: fjacquet/ci/.github/workflows/go-ci.yml@v1
  security:
    uses: fjacquet/ci/.github/workflows/go-security.yml@v1
  alert-rules:
    # promtool check + unit tests for deploy/prometheus/*.yml (digest-pinned image).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: promtool check + test rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/r" -w /r --entrypoint sh \
            prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 -c \
            'promtool check rules nbu.rules.yml rules-perclient.yml rules-tape.yml rules-multisite.yml &&
             promtool test rules nbu.rules_test.yml rules-perclient_test.yml rules-tape_test.yml rules-multisite_test.yml'
