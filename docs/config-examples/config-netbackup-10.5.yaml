---
# Configuration Example: NetBackup 10.5 (API 12.0)
#
# Auto-detection selects API 12.0 on 10.5, so no apiVersion is needed.
# 10.5 adds the tape collector (drives, tape media, volume pools, disk pools).
# alerts/malware/catalog/slo need API 14.0 (NetBackup 11.1+).

server:
    host: "0.0.0.0"
    port: "9440"
    uri: "/metrics"
    scrapingInterval: "1h"
    collectionInterval: "5m"
    logName: "stdout"

nbuservers:
    - site: "primary"
      scheme: "https"
      uri: "/netbackup"
      host: "${NBU1_HOSTNAME}"   # e.g. master.my.domain
      port: "1556"
      apiKey: "${NBU1_APIKEY}"
      insecureSkipVerify: "${NBU1_SKIP_CERTIFICATE:-false}"
      # apiVersion: "12.0"   # optional pin; omit to auto-detect (recommended)

collectors:
    tape:    { enabled: true }
    perClient:
        enabled: false
        allowlist: []        # exact client names, e.g. ["db01", "app02"]; empty = no series
