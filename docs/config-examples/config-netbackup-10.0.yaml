---
# Configuration Example: NetBackup 10.0 - 10.4 (API 10.0)
#
# Auto-detection selects API 10.0 on these releases, so no apiVersion is needed.
# Available here: core job and storage metrics. The tape collector and the
# alerts/malware/catalog/slo collectors need newer releases (see below).
# After an upgrade to 10.5+ or 11.x, a restart picks up the newer API.

server:
    host: "0.0.0.0"
    port: "9440"
    uri: "/metrics"
    scrapingInterval: "1h"
    collectionInterval: "5m"
    logName: "stdout"

nbuservers:
    - site: "primary"
      scheme: "https"
      uri: "/netbackup"
      host: "${NBU1_HOSTNAME}"   # e.g. master.my.domain
      port: "1556"
      apiKey: "${NBU1_APIKEY}"
      insecureSkipVerify: "${NBU1_SKIP_CERTIFICATE:-false}"
      # apiVersion: "10.0"   # optional pin; omit to auto-detect (recommended)

collectors:
    # tape needs API 12.0+ (NetBackup 10.5+); alerts/malware/catalog/slo need API 14.0 (11.1+).
    perClient:
        enabled: false
        allowlist: []        # exact client names, e.g. ["db01", "app02"]; empty = no series
