---
# Configuration Example: NetBackup 11.x (API 13.0 on 11.0, API 14.0 on 11.1 / 11.2)
#
# Auto-detection selects 14.0 on 11.1/11.2 and 13.0 on 11.0, so no apiVersion is
# needed. alerts/malware/catalog/slo need API 14.0: on 11.0 leave them disabled.

server:
    host: "0.0.0.0"
    port: "9440"
    uri: "/metrics"
    scrapingInterval: "1h"
    collectionInterval: "5m"
    logName: "stdout"

nbuservers:
    - site: "primary"
      scheme: "https"
      uri: "/netbackup"
      host: "${NBU1_HOSTNAME}"   # e.g. master.my.domain
      port: "1556"
      apiKey: "${NBU1_APIKEY}"
      insecureSkipVerify: "${NBU1_SKIP_CERTIFICATE:-false}"
      # apiVersion: "14.0"   # optional pin; omit to auto-detect (recommended)

collectors:
    alerts:  { enabled: true }    # API 14.0 (11.1+)
    malware: { enabled: true }    # API 14.0
    catalog: { enabled: true }    # API 14.0
    slo:     { enabled: true }    # API 14.0
    tape:    { enabled: true }
    perClient:
        enabled: false
        allowlist: []             # exact client names, e.g. ["db01", "app02"]; empty = no series
