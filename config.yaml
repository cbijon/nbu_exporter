---
server:
  host: "localhost"
  port: "9440"
  uri: "/metrics"
  scrapingInterval: "1h"
  # How often the background loop polls every NetBackup site (default 5m).
  # /metrics always serves the latest snapshot; it never calls NetBackup on scrape.
  collectionInterval: "5m"
  # "stdout" (also "" or "-") logs to stdout only — ideal for containers
  # (captured by `docker logs`), systemd/journald, and Kubernetes. Set a file
  # path (e.g. "/var/log/nbu_exporter/nbu-exporter.log") to also write a file;
  # its parent directory must already exist and be writable.
  logName: "stdout"

# nbuservers: one entry per NetBackup primary (master) server.
# The `site` value becomes the `site` label on every metric emitted for that
# server; Grafana dashboards filter on it. Each site is polled independently and
# detects its own API version, so masters on different NBU releases can coexist.
# Legacy `nbuserver:` (single block) still works but triggers a deprecation warning.
#
# host, apiKey and insecureSkipVerify support ${ENV_VAR} / ${ENV_VAR:-default}
# interpolation — set values in a .env file (gitignored). Literal values also work.
nbuservers:
  - site: "primary"
    scheme: "https"
    uri: "/netbackup"
    host: "${NBU1_HOSTNAME}"
    port: "1556"
    # apiVersion: Optional pin (10.0 / 12.0 / 13.0 / 14.0). Leave it unset:
    # auto-detection tries 14.0 → 13.0 → 12.0 → 10.0 and picks the highest the
    # master accepts (NetBackup 11.1 and 11.2 → 14.0).
    apiKey: "${NBU1_APIKEY}"
    # Skip TLS verification (self-signed cert on a trusted network only).
    insecureSkipVerify: "${NBU1_SKIP_CERTIFICATE:-false}"

  # Second master — uncomment and set NBU2_* in .env to enable multi-site.
  # - site: "secondary"
  #   scheme: "https"
  #   uri: "/netbackup"
  #   host: "${NBU2_HOSTNAME}"
  #   port: "1556"
  #   apiKey: "${NBU2_APIKEY}"
  #   insecureSkipVerify: "${NBU2_SKIP_CERTIFICATE:-false}"

# Optional: OpenTelemetry distributed tracing configuration
# Enables distributed tracing for NetBackup API calls and Prometheus scrape cycles.
# Useful for diagnosing slow scrapes and identifying performance bottlenecks.
opentelemetry:
  enabled: false
  # OTLP gRPC endpoint (Jaeger, Tempo, OTel Collector…)
  endpoint: "localhost:4317"
  insecure: true
  # Sampling rate: 1.0 = trace everything, 0.1 = 10%, 0.01 = 1%
  samplingRate: 0.1

# Optional: opt-in metric collectors (all default to disabled).
# Every collector degrades gracefully: an endpoint the master lacks, or one the
# API key may not read, is logged and skipped without failing the scrape.
collectors:
  # alerts/malware/catalog/slo use API 14.0 endpoints (NetBackup 11.1+).
  alerts:  { enabled: false }
  malware: { enabled: false }
  catalog: { enabled: false }
  slo:     { enabled: false }
  # Tape drives, media, partially-full volume pools and disk-pool volumes
  # (nbu-tape dashboard). All endpoints exist on NetBackup 11.x.
  tape:    { enabled: false }
  # Per-client backup compliance + lifecycle (BACKUP/DUPLICATION/IMPORT,
  # nbu-lifecycle dashboard). The client label is high-cardinality; an empty
  # allowlist emits nothing.
  perClient:
    enabled: false
    allowlist: []   # exact client names, e.g. ["db01", "app02"]
